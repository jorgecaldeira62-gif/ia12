<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Local - Ollama</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #header {
    background: #16213e;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid #0f3460;
  }

  #header h1 {
    font-size: 20px;
    color: #e94560;
    flex: 1;
  }

  #model-select {
    background: #0f3460;
    color: #eee;
    border: 1px solid #e94560;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  #status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: #333;
    color: #aaa;
  }

  #status.online { background: #1a472a; color: #4caf50; }
  #status.offline { background: #4a1010; color: #f44336; }

  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user {
    background: #0f3460;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }

  .msg.bot {
    background: #16213e;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
    border-left: 3px solid #e94560;
  }

  .msg.bot.thinking {
    color: #888;
    font-style: italic;
  }

  #input-area {
    background: #16213e;
    padding: 15px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #0f3460;
  }

  #user-input {
    flex: 1;
    background: #0f3460;
    color: #eee;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 15px;
    font-size: 15px;
    resize: none;
    height: 50px;
    max-height: 150px;
    outline: none;
    transition: border 0.2s;
  }

  #user-input:focus { border-color: #e94560; }

  #send-btn {
    background: #e94560;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s;
  }

  #send-btn:hover { background: #c73652; }
  #send-btn:disabled { background: #555; cursor: not-allowed; }

  #clear-btn {
    background: #0f3460;
    color: #aaa;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 0 15px;
    font-size: 13px;
    cursor: pointer;
  }

  #clear-btn:hover { color: #eee; border-color: #e94560; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #1a1a2e; }
  ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <h1>🤖 Chat Local</h1>
  <select id="model-select">
    <option value="qwen2.5:7b">qwen2.5:7b</option>
    <option value="llama3.2">llama3.2</option>
    <option value="llama3.1:8b">llama3.1:8b</option>
    <option value="mistral">mistral</option>
    <option value="deepseek-coder-v2">deepseek-coder-v2</option>
  </select>
  <span id="status">verificando...</span>
</div>

<div id="chat-box">
  <div class="msg bot">👋 Olá! Sou seu assistente local.<br><br>
  ✅ Certifique-se que o <strong>Ollama está rodando</strong> no seu PC.<br>
  📋 Escolha o modelo no menu acima.<br>
  💬 Digite sua mensagem e pressione Enter!</div>
</div>

<div id="input-area">
  <textarea id="user-input" placeholder="Digite sua mensagem... (Enter para enviar)"></textarea>
  <button id="clear-btn" title="Limpar conversa">🗑️</button>
  <button id="send-btn">➤</button>
</div>

<script>
  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const clearBtn = document.getElementById('clear-btn');
  const modelSelect = document.getElementById('model-select');
  const statusEl = document.getElementById('status');

  let historico = [];

  // Verifica se Ollama está online
  async function verificarOllama() {
    try {
      const r = await fetch('http://localhost:11434/api/tags');
      if (r.ok) {
        const data = await r.json();
        statusEl.textContent = '🟢 Online';
        statusEl.className = 'online';
        
        // Preenche modelos disponíveis automaticamente
        if (data.models && data.models.length > 0) {
          modelSelect.innerHTML = '';
          data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = m.name;
            modelSelect.appendChild(opt);
          });
        }
      }
    } catch {
      statusEl.textContent = '🔴 Offline';
      statusEl.className = 'offline';
    }
  }

  verificarOllama();
  setInterval(verificarOllama, 10000);

  function addMsg(texto, tipo) {
    const div = document.createElement('div');
    div.className = `msg ${tipo}`;
    div.textContent = texto;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function enviar() {
    const texto = userInput.value.trim();
    if (!texto) return;

    userInput.value = '';
    userInput.style.height = '50px';
    sendBtn.disabled = true;

    addMsg(texto, 'user');
    historico.push({ role: 'user', content: texto });

    const botDiv = addMsg('⏳ Pensando...', 'bot thinking');

    try {
      const response = await fetch('http://localhost:11434/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelSelect.value,
          messages: historico,
          stream: true
        })
      });

      if (!response.ok) throw new Error('Erro na resposta');

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let resposta = '';
      botDiv.className = 'msg bot';
      botDiv.textContent = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value);
        const linhas = chunk.split('\n').filter(l => l.trim());
        
        for (const linha of linhas) {
          try {
            const json = JSON.parse(linha);
            if (json.message && json.message.content) {
              resposta += json.message.content;
              botDiv.textContent = resposta;
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          } catch {}
        }
      }

      historico.push({ role: 'assistant', content: resposta });

    } catch (err) {
      botDiv.className = 'msg bot';
      botDiv.textContent = '❌ Erro! Verifique se o Ollama está rodando.\n\nAbra o terminal e digite:\nollama serve';
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  sendBtn.addEventListener('click', enviar);

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = '50px';
    userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
  });

  clearBtn.addEventListener('click', () => {
    historico = [];
    chatBox.innerHTML = '<div class="msg bot">🗑️ Conversa limpa! Pode começar de novo.</div>';
  });
</script>

</body>
</html>
